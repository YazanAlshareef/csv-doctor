[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csv-doctor"
version = "0.1.0"
description = "Profile and clean messy CSV files, with a Markdown report and a log of every change."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Yazan Alshareef" }]
keywords = ["csv", "data-cleaning", "pandas", "cli", "data-quality"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Utilities",
]
dependencies = ["pandas>=2.0", "typer>=0.12"]

[project.urls]
Homepage = "https://github.com/YazanAlshareef/csv-doctor"
Source = "https://github.com/YazanAlshareef/csv-doctor"
Issues = "https://github.com/YazanAlshareef/csv-doctor/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
csv-doctor = "csv_doctor.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
